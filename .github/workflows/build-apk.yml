name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Detect Android project directory
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts repo me nahi mila!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(cd "$(dirname "$SETTINGS_FILE")" && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Ensure debug.keystore and .env exist
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gossaigaon-Store-Debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'

      - name: Check Release Keystore Secret
        id: check_keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Release Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$PROJECT_DIR/my-upload-key.jks"

      - name: Build Release APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Upload Release APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Gossaigaon-Store-Release-APK
          path: '**/app/build/outputs/apk/release/*.apk'
